# DWI Migration Testing - CRT-6323
#
# csv: Redshift CSV extract vs Snowflake CSV extract, both in S3
# dwi: UAT_DB.EDP_DWI vs PROD_DB.EDP_DWI, in Snowflake
#
# ONE canonical view list. A CSV object and its EDP_DWI view are the same
# object - learning_enrolment.csv is an unload of DWI_LEARNING_ENROLMENT - so
# the grain is the same too. Names are written lowercase without the DWI_
# prefix and expanded per mode at load: `name` -> DWI_NAME, and grain and
# column names are upper-cased for Snowflake, lower-cased for the CSV headers.
#
# Grain is never defaulted. An empty grain is not an error: C0/C1/C2/C5 and
# D0/D2/D4 still run; the row-level tiers (C3/C4, D1/D3) skip and say so.
# Filled grains were mapped from the CRT-6248 BI config and are UNVERIFIED
# against the DWI column names - D1 is the check.

connection:
  # role: UAT_ANALYTICS_ROLE
  warehouse: null
  query_tag: dwi_migration_testing
  # Prefer an explicit list over `true` (= ALL); ALL can trip RLS error 090150.
  use_secondary_roles: true

aws:
  region: ap-southeast-2
  # profile: p-elmo

defaults:
  diff_threshold_pct: 0.1   # at or below this % -> ACCEPTED, not FAIL
  sample_rows: 1000
  t3_sample_columns: 20
  t3_samples_per_column: 15
  csv_sample_columns: 20
  csv_samples_per_column: 15
  nullif_text: true
  trim_text: false
  always_fingerprint: false

csv:
  redshift_base: s3://p-elmo-data-cap/landing/data-warehouse-integration
  snowflake_base: s3://p-elmo-data-cap/landing/data-warehouse-integration/snowflake_outbound

  # Newest run folder per client on each side is auto-discovered. Pin a pair
  # with --redshift-run / --snowflake-run.
  clients:
    - uat1
    - skillsconsulting
    - csc
    - catercare
    - achieveaus
    - brams
    - sonder
    - atsichsbrisbane

  normalisation:
    trim_text: true
    blank_as_null: true
    null_tokens: ["", "null", "\\N"]
    normalise_booleans: true
    # Numeric 1/0 count as booleans ONLY for these columns - otherwise an id
    # of 1 normalises to "true" and corrupts the join key.
    boolean_columns: [is_active, is_deleted, is_mandatory, is_completed]
    normalise_timestamps: true
    numeric_scale: null
    case_insensitive: false

dwi:
  prod_db: PROD_DB.EDP_DWI
  uat_db: UAT_DB.EDP_DWI
  schema: EDP_DWI

  # Off by default: TEMP_ACTIVE_TENANTS exists in UAT_DB only, so joining it
  # across a UAT/PROD pair would silently filter one side.
  tenant_join: false
  # active_tenants: UAT_DB.BI.TEMP_ACTIVE_TENANTS

# ---------------------------------------------------------------------------
# Views - one list, both modes
# ---------------------------------------------------------------------------
# Per-view fields:
#   grain              [] disables the row-level tiers for that view
#   clients            csv only; per-tenant views only appear in that unload
#   exclude_columns    dropped from the comparison entirely
#   accepted_columns   measured and reported, never fail the view. Add `where`
#                      (SQL against prod_value / uat_value) to accept only the
#                      known pattern; the residual still counts as a diff.
#   accept_diff        force a tier to ACCEPTED (C2-C5 / D1-D4; never C0/C1/D0)
views:
  # ── Core / shared ─── 6 views, 2 with grain
  - name: date_effectivity
    grain: []
  - name: user_department
    grain: []
    accepted_columns:
      - column: goals
        reason: "LISTAGG of multiple goals - order is not guaranteed"
      - column: competencies
        reason: "LISTAGG of multiple competencies - order is not guaranteed"
      - column: development
        reason: "LISTAGG of multiple development items - order is not guaranteed"
  - name: user_location
    grain: []
  - name: user_position
    grain: []
  - name: work_pattern
    grain: [assigment_id, user_id, client_name, region]
  - name: work_pattern_weeks
    grain: [work_pattern_id, work_week, client_name, region]

