    expected_blocked: []
    accept_diff:
      T2: >
        This is a very small table, so the 4 record difference has breached the threshold.
      T4: >
        T4 is very unlikely to map simply as a result of timing.
    # CRT-6248 lists CLIENT_REGION twice (typo) — corrected to NAME+REGION here.


